<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raven Gear — pure logic tests</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 820px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #6b7280; margin: 0 0 16px; }
  #summary { display:inline-block; font-weight:700; padding:6px 12px; border-radius:8px; margin-bottom:12px; background:#e5e7eb; }
  #summary.pass { background:#dcfce7; color:#166534; }
  #summary.fail { background:#fee2e2; color:#991b1b; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid #e5e7eb33; flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .row.pass .dot { background:#22c55e; }
  .row.fail .dot { background:#ef4444; }
  .name { flex:1 1 auto; }
  .err { flex:1 1 100%; margin:4px 0 6px 17px; padding:8px; background:#fee2e233; border-radius:6px; white-space:pre-wrap; color:#991b1b; font-size:12px; }
</style>
</head>
<body>
  <h1>Raven Gear — pure logic tests</h1>
  <p class="sub">DOM-free. Imports math + domain modules directly (no hub, no iframe).</p>
  <div id="summary">Loading…</div>
  <div id="results"></div>
  <script type="module" src="./pure-logic-tests.js"></script>
</body>
</html>
